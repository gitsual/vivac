welcome.continue=Enter to continue
welcome.skip=Enter to skip this step
welcome.tour.terminal.title=Open a terminal
welcome.tour.terminal.body=Press {1} + Enter.|Another window appears beside this one: the desktop|places windows by itself, without you dragging them.
welcome.tour.close.title=Close a window
welcome.tour.close.body=Press {1} + Q over the terminal you just opened.|It ALWAYS closes the window that has the focus.
welcome.tour.workspace.title=Move to another desktop
welcome.tour.workspace.body=Press {1} + 2.|You have ten numbered desktops; the bar at the top|tells you which one you are on.
welcome.tour.carry.title=Take a window with you
welcome.tour.carry.body=Open a terminal here with {1} + Enter,|then press {1} + Shift + 3.|The window goes to desktop 3 and you stay.
welcome.tour.help.title=Help is always there
welcome.tour.help.body=Press F1: the Hyprland shortcuts, in your language.|F2 the browser, F3 the shell, F4 the editor, F5 the system.
welcome.tour.escape.title=And Escape closes it
welcome.tour.escape.body=Press Escape to close the help pane.|Escape closes the pane; do not confuse it with closing the window.
welcome.tour.bar.title=The bar at the top
welcome.tour.bar.body=On the left: the desktops and the window title.|In the middle: the time and the weather where you are.|On the right: network, sound, bluetooth, CPU, memory, disk.||Click the network module and it shows your IP address|and the interface name. Hover over it to see how much|goes up and how much comes down.
welcome.tour.sound.title=Sound
welcome.tour.sound.body=Raise or lower the volume with your keyboard keys,|or click the speaker in the bar to open the mixer|and choose which output each program plays through.
welcome.tour.install.title=Install a program
welcome.tour.install.body=Type in a terminal:|  sudo pacman -S chromium|The password is the one you logged in with.|pacman fetches the browser and its dependencies.
welcome.tour.remove.title=And uninstall it
welcome.tour.remove.body=Now:|  sudo pacman -Rns chromium|-R removes it, -n deletes its configuration files|and -s takes away the dependencies nobody uses any more.
welcome.done.title=Done
welcome.done.subtitle=You know enough to break things on purpose now.
welcome.done.help=F1 to F5 open the help panes; Escape closes them.
welcome.done.keys={1} + R opens the launcher. {1} + Q closes the window.
welcome.done.power={1} + Shift + E powers off, reboots or logs out.
welcome.done.rerun=Come back to this wizard whenever you like: vivac-welcome
welcome.done.theme=Change theme without it: scripts/apply-theme.sh --theme NAME
welcome.done.hint=Enter to start
welcome.super=Windows
