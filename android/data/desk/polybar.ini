; The phone's own desktop bar (android/bin/vivac-desk), dressed like the phone
; screen's Waybar: workspaces on the left, the time in the middle, the
; phone's gauges and the power button on the right. Linked to
; ~/.config/polybar/config.ini by android/scripts/deploy.sh.

[colors]
bar = #F2283536
chip = #B3302B21
fg = #C9C9C8
sand = #E8D5AB
olive = #979367
accent = #AAA875
active = #E1777D
urgent = #BD6161

[bar/vivac]
width = 100%:-16
offset-x = 8
offset-y = 4
height = 30
radius = 12
background = ${colors.bar}
foreground = ${colors.fg}
border-bottom-size = 3
border-bottom-color = ${colors.accent}
line-size = 2
padding = 1
module-margin = 1
font-0 = Fira Code:size=11;3
font-1 = monospace:size=11;3
modules-left = apps workspaces
modules-center = date
modules-right = memory battery power
wm-restack = i3
enable-ipc = true
cursor-click = pointer

[module/apps]
type = custom/text
format = apps
format-background = ${colors.chip}
format-padding = 1
click-left = rofi -show drun &

[module/workspaces]
type = internal/i3
pin-workspaces = false
enable-click = true
enable-scroll = false
label-focused = %name%
label-focused-foreground = ${colors.sand}
label-focused-underline = ${colors.active}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.olive}
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-underline = ${colors.urgent}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %time%  %date%
format-background = ${colors.chip}
format-padding = 1

[module/memory]
type = internal/memory
interval = 5
label = mem %percentage_used%%
format-background = ${colors.chip}
format-padding = 1

; Android keeps /sys/class/power_supply from apps; Termux:API reads it.
[module/battery]
type = custom/script
exec = termux-battery-status 2>/dev/null | sed -n 's/.*"percentage": *\([0-9]*\).*/bat \1%/p'
interval = 60
format-background = ${colors.chip}
format-padding = 1

[module/power]
type = custom/text
format = off
format-background = ${colors.accent}
format-foreground = #283536
format-padding = 1
click-left = vivac-desk stop &
