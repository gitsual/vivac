[extend]
useDefault = true

[[allowlists]]
description = "Ignored local VM, build and audit artifacts; none of these paths is tracked"
paths = [
  '''^\.vm-test/''',
  '''^\.vm-image/''',
  '''^dist/''',
  '''^\.audit/'''
]

[[allowlists]]
description = "Bluetooth sync fixtures: made-up link keys (00112233...) for the tests, no real device"
paths = [
  '''^tests/data/bt-sync/'''
]
