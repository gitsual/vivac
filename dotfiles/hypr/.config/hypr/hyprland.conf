# Portable baseline distilled from the live workstation. Anything that depends
# on the machine (monitors, input devices, GPU) lives in the generated
# fragments below, rendered by scripts/render-config.sh from hardware facts.

$terminal = kitty
$menu = rofi -show drun
$scripts = $HOME/.config/hypr/scripts

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

source = ~/.config/hypr/generated/hardware.conf
source = ~/.config/hypr/generated/monitors.conf
source = ~/.config/hypr/generated/input.conf

general {
    gaps_in = 8
    gaps_out = 15
    border_size = 3
    col.active_border = rgb(E1777D) rgb(979367) 45deg
    col.inactive_border = rgb(7C606E)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
    dim_inactive = true
    dim_strength = 0.2
}

animations {
    enabled = true
    bezier = warmEase, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 4, overshot, slide
    animation = windowsIn, 1, 7, warmEase
    animation = windowsOut, 1, 7, default, popin 80%
    animation = windowsMove, 1, 7, default
    animation = border, 1, 10, default
    animation = fade, 1, 10, default
    animation = workspaces, 1, 6, overshot, slidevert
}

# Written across lines because Hyprlang has no inline block: on one line both
# of these parsed as nothing and hyprctl getoption answered 0 for each.
dwindle {
    preserve_split = true
}
master {
    new_on_top = true
}

# @help: hypr help.hypr.terminal
bind = SUPER, Return, exec, $terminal
# @help: hypr help.hypr.launcher
bind = SUPER, R, exec, $menu
# @help: hypr help.hypr.dmenu
bind = SUPER, D, exec, dmenu_run -fn 'JetBrains Mono Nerd Font-12' -nb '#2D1F2D' -nf '#E8D5AB' -sb '#E1777D' -sf '#2D1F2D'
# @help: hypr help.hypr.wofi
bind = SUPER ALT, R, exec, wofi --show drun
# @help: hypr help.hypr.editor
bind = SUPER, E, exec, $terminal -e nvim
# @help: hypr help.hypr.close
bind = SUPER, Q, killactive
# @help: hypr help.hypr.exit
bind = SUPER, M, exit
# @help: hypr help.hypr.floating
bind = SUPER, Space, togglefloating
# @help: hypr help.hypr.fullscreen
bind = SUPER, F, fullscreen
# @help: hypr help.hypr.split
bind = SUPER, J, layoutmsg, togglesplit
# @help: hypr help.hypr.lock
bind = SUPER, L, exec, hyprlock
# @help: hypr help.hypr.screenshot
bind = SUPER SHIFT, S, exec, $scripts/screenshot.sh
# @help: hypr help.hypr.help_hypr
bind = , F1, exec, $scripts/help-pane.sh --pane hypr
# @help: hypr help.hypr.help_browser
bind = , F2, exec, $scripts/help-pane.sh --pane browser
# @help: hypr help.hypr.help_shell
bind = , F3, exec, $scripts/help-pane.sh --pane shell
# @help: hypr help.hypr.help_editor
bind = , F4, exec, $scripts/help-pane.sh --pane editor
# @help: hypr help.hypr.help_system
bind = , F5, exec, $scripts/help-pane.sh --pane system
# @help: hypr help.hypr.power
bind = SUPER SHIFT, E, exec, $HOME/.config/rofi/power/powermenu.sh
# @help: hypr help.hypr.power_bar
bind = SUPER SHIFT, Q, exec, $HOME/.local/bin/vivac-power
# @help: hypr help.hypr.theme
bind = SUPER SHIFT, T, exec, $HOME/.local/bin/vivac-theme
# @help: hypr help.hypr.clipboard
bind = SUPER, V, exec, cliphist list | rofi -dmenu -i -p Clipboard | cliphist decode | wl-copy
# @help: hypr help.hypr.reload
bind = SUPER SHIFT, R, exec, hyprctl reload

# @help: hypr help.hypr.focus_left
bind = SUPER, left, movefocus, l
# @help: hypr help.hypr.focus_right
bind = SUPER, right, movefocus, r
# @help: hypr help.hypr.focus_up
bind = SUPER, up, movefocus, u
# @help: hypr help.hypr.focus_down
bind = SUPER, down, movefocus, d
# @help: hypr help.hypr.move_left
bind = SUPER SHIFT, left, movewindow, l
# @help: hypr help.hypr.move_right
bind = SUPER SHIFT, right, movewindow, r
# @help: hypr help.hypr.move_up
bind = SUPER SHIFT, up, movewindow, u
# @help: hypr help.hypr.move_down
bind = SUPER SHIFT, down, movewindow, d
# @help: hypr help.hypr.shrink_w
bind = SUPER ALT, left, resizeactive, -10 0
# @help: hypr help.hypr.grow_w
bind = SUPER ALT, right, resizeactive, 10 0
# @help: hypr help.hypr.shrink_h
bind = SUPER ALT, up, resizeactive, 0 -10
# @help: hypr help.hypr.grow_h
bind = SUPER ALT, down, resizeactive, 0 10

# @help: hypr help.hypr.ws_1
bind = SUPER, 1, workspace, 1
# @help: hypr help.hypr.ws_2
bind = SUPER, 2, workspace, 2
# @help: hypr help.hypr.ws_3
bind = SUPER, 3, workspace, 3
# @help: hypr help.hypr.ws_4
bind = SUPER, 4, workspace, 4
# @help: hypr help.hypr.ws_5
bind = SUPER, 5, workspace, 5
# @help: hypr help.hypr.ws_6
bind = SUPER, 6, workspace, 6
# @help: hypr help.hypr.ws_7
bind = SUPER, 7, workspace, 7
# @help: hypr help.hypr.ws_8
bind = SUPER, 8, workspace, 8
# @help: hypr help.hypr.ws_9
bind = SUPER, 9, workspace, 9
# @help: hypr help.hypr.ws_10
bind = SUPER, 0, workspace, 10
# @help: hypr help.hypr.ws_move_1
bind = SUPER SHIFT, 1, movetoworkspace, 1
# @help: hypr help.hypr.ws_move_2
bind = SUPER SHIFT, 2, movetoworkspace, 2
# @help: hypr help.hypr.ws_move_3
bind = SUPER SHIFT, 3, movetoworkspace, 3
# @help: hypr help.hypr.ws_move_4
bind = SUPER SHIFT, 4, movetoworkspace, 4
# @help: hypr help.hypr.ws_move_5
bind = SUPER SHIFT, 5, movetoworkspace, 5
# @help: hypr help.hypr.ws_move_6
bind = SUPER SHIFT, 6, movetoworkspace, 6
# @help: hypr help.hypr.ws_move_7
bind = SUPER SHIFT, 7, movetoworkspace, 7
# @help: hypr help.hypr.ws_move_8
bind = SUPER SHIFT, 8, movetoworkspace, 8
# @help: hypr help.hypr.ws_move_9
bind = SUPER SHIFT, 9, movetoworkspace, 9
# @help: hypr help.hypr.ws_move_10
bind = SUPER SHIFT, 0, movetoworkspace, 10
# Walk the numbered workspaces in order and wrap at the ends (e = existing,
# with wraparound). Special workspaces are never part of this sequence.
# @help: hypr help.hypr.ws_next
bind = SUPER, bracketright, workspace, e+1
# @help: hypr help.hypr.ws_prev
bind = SUPER, bracketleft, workspace, e-1

# Apps that remember being maximized ask for it again on launch; honouring
# that makes a new window cover the workspace instead of splitting it.
windowrule = suppress_event maximize, match:class .*
windowrule = float on, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$
windowrule = animation slide, match:class ^(rofi)$
windowrule = float on, match:class ^(nm-connection-editor)$
# The wizard is the only thing on screen while it runs: floating, centred and
# large enough to read without leaning in.
windowrule = float on, match:class ^(vivac-welcome)$
windowrule = center on, match:class ^(vivac-welcome)$
windowrule = size 1100 700, match:class ^(vivac-welcome)$

exec-once = waybar
exec-once = hypridle
# Clipboard history for the picker below; harmless when cliphist is absent.
exec-once = wl-paste --watch cliphist store
exec-once = ~/.config/waybar/scripts/ws-refresh.sh
exec-once = dunst
exec-once = bash $scripts/wallpaper.sh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# The first session, and only the first: the wizard writes a marker and
# --first-run is a no-op afterwards. It is started last so the bar, the
# wallpaper and the notification daemon are already up to be previewed.
exec-once = $terminal --class vivac-welcome -e $HOME/.local/bin/vivac-welcome --first-run
