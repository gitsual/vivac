# Idle management for the Hyprland session: lock, then screen off, then
# suspend. Every timeout is undone by input; hyprlock draws the lock screen
# (hyprlock.conf), so this file has no colour of its own.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $HOME/.config/hypr/scripts/dispatch.sh dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = $HOME/.config/hypr/scripts/dispatch.sh dpms off
    on-resume = $HOME/.config/hypr/scripts/dispatch.sh dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
