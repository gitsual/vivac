welcome.language_title=Language
welcome.language_note=  The bar picks the language up at its next start; this wizard already has.
welcome.mod_title=The modifier key
welcome.mod_explain=  Every window-manager key is this key plus another. Alt is reliable everywhere\n  but takes Alt+letter shortcuts from applications; Windows matches the original\n  desktop, but Windows keeps some Win combinations (Win+L) for itself.
