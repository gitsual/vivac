welcome.step_theme=  The eight palettes, any time: {1}
welcome.step_bar=  The bar: the ten desktops on the left (click or scroll them), the clock in the middle,\n  your IP address on the network gauge, the volume (click mutes, scroll changes it),\n  and at the end the theme picker and the power menu.
welcome.step_install=  Software comes from winget. Install a small program in a terminal:\n    {1}
welcome.step_uninstall=  And remove it again, which is the half worth learning:\n    {1}
welcome.done_step=    done.
welcome.skipped=    skipped.
welcome.press_enter=Press Enter to continue
welcome.end_title=Ready
welcome.end=  That is all. {1} brings the keys back whenever you need them.

