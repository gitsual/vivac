# The one palette source. Every committed theme file under dotfiles/ that
# carries a colour is rendered from a template under templates/ against these
# values; scripts/check-theme-drift.sh fails when a rendered file and its
# committed copy differ. Edit here, re-render, never edit the output.
#
# Values are bare upper-case hex (no #): templates choose the notation their
# tool wants with a filter — @COLOR_BG@ gives 2D1F2D, @COLOR_BG:lower@ gives
# 2d1f2d, @COLOR_BG:rgb@ gives "45, 31, 45" for rgba() in CSS.
#
# Bad Romance · Nocturne
# @title: Bad Romance
# @essence: Nocturne
COLOR_BG=2D1F2D
COLOR_FG=E8D5AB
COLOR_FG_DIM=C0AD95
COLOR_SURFACE=43363F
COLOR_SURFACE_ALT=5A4855
COLOR_ACCENT=E1777D
COLOR_MUTED=979367
COLOR_URGENT=BD6161
COLOR_INFO=6CA4B1
COLOR_OK=55A185
COLOR_BORDER_INACTIVE=7C606E
# The terminal keeps its own neutral pair on purpose: code is read there for
# hours, and the warm palette is for chrome, not for text.
TERMINAL_BG=18131B
TERMINAL_FG=E8D5AB
