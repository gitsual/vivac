# Conservative Pulse compatibility buffers: enough headroom for games and
# Bluetooth without forcing an excessive latency on every native client.
pulse.properties = {
    pulse.min.req = 1024/48000
    pulse.default.req = 2048/48000
    pulse.min.frag = 1024/48000
    pulse.default.frag = 2048/48000
    pulse.default.tlength = 16384/48000
    pulse.min.quantum = 1024/48000
    pulse.idle.timeout = 0
}
