     fill="none" stroke="#E8D5AB" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
  <rect x="4.6" y="10.4" width="14.8" height="10" rx="2.2"/>
  <path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/>
  <path d="M12 14.4v2.2"/>
</svg>
