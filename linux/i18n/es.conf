welcome.tour.terminal.title=Abrir una terminal
welcome.tour.terminal.body=Pulsa {1} + Enter.|Aparecerá otra ventana junto a esta: el escritorio|coloca las ventanas solo, sin que las arrastres.
welcome.tour.close.title=Cerrar una ventana
welcome.tour.close.body=Pulsa {1} + Q sobre la terminal que acabas de abrir.|Cierra SIEMPRE la ventana que tiene el foco.
welcome.tour.workspace.title=Cambiar de escritorio
welcome.tour.workspace.body=Pulsa {1} + 2.|Tienes diez escritorios numerados; la barra de arriba|te dice en cuál estás.
welcome.tour.carry.title=Llevarte una ventana contigo
welcome.tour.carry.body=Con {1} + Enter abre una terminal aquí,|y luego pulsa {1} + Shift + 3.|La ventana se va al escritorio 3 y tú te quedas.
welcome.tour.help.title=La ayuda siempre está ahí
welcome.tour.help.body=Pulsa F1: los atajos de Hyprland, en tu idioma.|F2 el navegador, F3 la consola, F4 el editor, F5 el sistema.
welcome.tour.escape.title=Y se cierra con Escape
welcome.tour.escape.body=Pulsa Escape para cerrar el panel de ayuda.|Escape cierra el panel; no lo confundas con cerrar la ventana.
welcome.tour.bar.title=La barra de arriba
welcome.tour.bar.body=A la izquierda: los escritorios y el título de la ventana.|En el centro: la hora y el tiempo de tu ciudad.|A la derecha: red, sonido, bluetooth, CPU, memoria, disco.||Pincha el módulo de red y te enseña tu dirección IP|y el nombre de la interfaz. Pásale el ratón por encima|para ver además cuánto sube y cuánto baja.
welcome.tour.sound.title=El sonido
welcome.tour.sound.body=Sube o baja el volumen con las teclas de tu teclado,|o pincha el altavoz de la barra para abrir el mezclador|y elegir por qué salida suena cada programa.
welcome.tour.install.title=Instalar un programa
welcome.tour.install.body=Escribe en una terminal:|  sudo pacman -S chromium|La contraseña es la misma con la que has entrado.|pacman baja el navegador y sus dependencias.
welcome.tour.remove.title=Y desinstalarlo
welcome.tour.remove.body=Ahora:|  sudo pacman -Rns chromium|-R lo quita, -n borra sus ficheros de configuración|y -s se lleva las dependencias que ya no usa nadie.
welcome.done.title=Listo
welcome.done.subtitle=Ya sabes lo suficiente para romper cosas con criterio.
welcome.done.help=F1 a F5 abren los paneles de ayuda; Escape los cierra.
welcome.done.keys={1} + R abre el lanzador. {1} + Q cierra la ventana.
welcome.done.power={1} + Shift + E apaga, reinicia o cierra la sesión.
welcome.done.rerun=Vuelve a este asistente cuando quieras: vivac-welcome
welcome.done.theme=Cambia de tema sin él: scripts/apply-theme.sh --theme NOMBRE
welcome.done.hint=Enter para empezar
