<?xml version="1.0" encoding="UTF-8"?>
<!-- The mark alone, square, for anywhere the wordmark does not fit: the same
     coin the banner carries, with nothing behind it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="vivac">
  <defs>
    <radialGradient id="halo"><stop stop-color="#E1777D" stop-opacity=".30"/><stop offset="1" stop-color="#E1777D" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x2=".7" y2="1"><stop stop-color="#E8D5AB"/><stop offset="1" stop-color="#E1777D"/></linearGradient>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#140D14"/><stop offset=".55" stop-color="#2D1F2D"/><stop offset="1" stop-color="#5A4855"/></linearGradient>
    <linearGradient id="ridge" x2=".5" y2="1"><stop stop-color="#463842"/><stop offset="1" stop-color="#2E252C"/></linearGradient>
    <linearGradient id="front" x2="0" y2="1"><stop stop-color="#2E252C"/><stop offset="1" stop-color="#140D14"/></linearGradient>
    <clipPath id="coin"><circle cx="128" cy="128" r="104"/></clipPath>
  </defs>

  <g clip-path="url(#coin)">
    <circle cx="128" cy="128" r="104" fill="url(#sky)"/>
    <ellipse cx="166" cy="98" rx="94" ry="79" fill="url(#halo)"/>
    <g fill="#E8D5AB" opacity=".45"><circle cx="72" cy="70" r="2.2"/><circle cx="105" cy="49" r="2.5"/><circle cx="209" cy="78" r="2.2"/><circle cx="56" cy="116" r="1.8"/></g>
    <circle cx="166" cy="98" r="33" fill="url(#moon)"/>
    <path d="M24 174 72 143 110 169 166 113 209 161 232 146v86H24Z" fill="url(#ridge)"/>
    <path d="m166 113 43 48-33-14-10 6z" fill="#E1777D" opacity=".25"/>
    <path d="M24 204 80 184 133 209 191 176 232 199v33H24Z" fill="url(#front)"/>
  </g>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#E1777D" stroke-width="5"/>
</svg>
